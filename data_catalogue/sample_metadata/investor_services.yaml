        isCDE: true
        cdeTier: 2
        accessRestricted: true
        description: "KYC/AML clearance status — restricted access, Compliance-owned monitoring"
    lineage:
      upstream: ["nav_calculation.nav_daily"]
      downstream: ["regulatory_reporting.aifmd_annex_iv", "client_reporting.investor_statements"]
